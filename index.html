<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>वस्त्रमित्र - AI बिल & सप्लायर खाता</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header { background: #1e293b; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    header h1 { font-size: 17px; font-weight: 700; }
    .btn-key { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
    .stat-card { background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .stat-card small { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-card h3 { font-size: 18px; margin-top: 2px; }

    .scan-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 10px; }
    .btn-act { padding: 12px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; color: white; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-camera { background: var(--primary); }
    .btn-gallery { background: #475569; }
    .btn-pdf { background: #d97706; }
    .btn-pay { background: var(--success); }

    #aiLoader { display: none; background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 10px; padding: 14px; margin: 0 12px 12px; text-align: center; }
    .spin { width: 22px; height: 22px; border: 3px solid #bae6fd; border-top-color: var(--primary); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 6px; }
    @keyframes sp { to { transform: rotate(360deg); } }

    .form-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 0 12px 14px; display: none; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; background: white; }

    .item-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .item-tbl th { background: #f8fafc; padding: 6px; text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); }
    .item-tbl td { padding: 4px; border-bottom: 1px solid var(--border); }
    .item-tbl input { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; }

    .tabs { display: flex; background: white; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: var(--muted); border: none; background: none; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .card-list { padding: 0 12px; }
    .row-card { background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .row-card h4 { font-size: 14px; }
    .row-card p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .row-card .amt { font-size: 15px; font-weight: 700; text-align: right; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>वस्त्रमित्र AI खाता v2.1</h1>
      <small style="opacity:0.8; font-size:10px;">सप्लायर & बिल ट्रैकिंग</small>
    </div>
    <button class="btn-key" onclick="setApiKey()">🔑 AI Key</button>
  </header>

  <div class="dashboard">
    <div class="stat-card">
      <small>कुल बिल खरीद (₹)</small>
      <h3 id="dashBilled">₹0</h3>
    </div>
    <div class="stat-card">
      <small>कुल भुगतान (₹)</small>
      <h3 id="dashPaid" style="color:var(--success);">₹0</h3>
    </div>
    <div class="stat-card">
      <small>सप्लायर देनदारी (₹)</small>
      <h3 id="dashDue" style="color:var(--danger);">₹0</h3>
    </div>
    <div class="stat-card">
      <small>कुल बिल</small>
      <h3 id="dashCount">0</h3>
    </div>
  </div>

  <div class="scan-options">
    <button class="btn-act btn-camera" onclick="document.getElementById('inputCamera').click()">
      📷 कैमरा स्कैन
    </button>
    <button class="btn-act btn-gallery" onclick="document.getElementById('inputGallery').click()">
      🖼️ गैलरी फोटो
    </button>
    <button class="btn-act btn-pdf" onclick="document.getElementById('inputPdf').click()">
      📄 PDF बिल
    </button>
    <button class="btn-act btn-pay" onclick="showPayForm()">
      💰 + भुगतान एंट्री
    </button>
  </div>

  <input type="file" id="inputCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelected(event, 'image')">
  <input type="file" id="inputGallery" accept="image/*" style="display:none;" onchange="handleFileSelected(event, 'image')">
  <input type="file" id="inputPdf" accept="application/pdf" style="display:none;" onchange="handleFileSelected(event, 'pdf')">

  <div id="aiLoader">
    <div class="spin"></div>
    <p id="loaderStatus" style="font-weight:700; color:var(--primary); font-size:13px;">AI बिल पढ़ रहा है...</p>
    <small style="color:var(--muted);">सप्लायर, सामान और रकम निकाली जा रही है</small>
  </div>

  <!-- बिल फॉर्म -->
  <div class="form-box" id="billForm">
    <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
      <h3 style="font-size:15px;">📝 बिल विवरण जांचें & सेव करें</h3>
      <button onclick="document.getElementById('billForm').style.display='none'" style="border:none; background:none; font-size:16px;">✕</button>
    </div>

    <div class="form-group">
      <label style="color:var(--primary); font-weight:700;">🏢 सप्लायर का नाम (विक्रेता / फर्म) *</label>
      <input type="text" id="bSupplier" placeholder="सप्लायर फर्म नाम">
    </div>

    <div style="display:flex; gap:8px;" class="form-group">
      <div style="flex:1;">
        <label>खरीदार / दुकान का नाम</label>
        <input type="text" id="bBuyer" placeholder="Billed to नाम">
      </div>
      <div style="flex:1;">
        <label>बिल नंबर</label>
        <input type="text" id="bNo">
      </div>
    </div>

    <div class="form-group">
      <label>तारीख</label>
      <input type="date" id="bDate">
    </div>

    <div class="form-group">
      <label>आइटम विवरण</label>
      <table class="item-tbl">
        <thead>
          <tr><th>सामान</th><th width="45">Qty</th><th width="65">भाव ₹</th><th width="70">कुल ₹</th></tr>
        </thead>
        <tbody id="tblItems"></tbody>
      </table>
    </div>

    <div style="display:flex; gap:8px;" class="form-group">
      <div style="flex:1;">
        <label>कुल बिल रकम (₹) *</label>
        <input type="number" id="bTotal" style="font-weight:800; font-size:16px;">
      </div>
      <div style="flex:1;">
        <label>तुरंत दिया (Paid)</label>
        <input type="number" id="bAdvance" value="0">
      </div>
    </div>

    <button class="btn-act btn-camera" style="width:100%; margin-top:6px;" onclick="saveBill()">✓ बिल सुरक्षित करें</button>
  </div>

  <!-- भुगतान फॉर्म (Dropdown) -->
  <div class="form-box" id="payForm">
    <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
      <h3 style="font-size:15px;">💰 सप्लायर को भुगतान दर्ज करें</h3>
      <button onclick="document.getElementById('payForm').style.display='none'" style="border:none; background:none; font-size:16px;">✕</button>
    </div>
    
    <div class="form-group">
      <label>सप्लायर चुनें *</label>
      <select id="pPartySelect" onchange="checkCustomSupplier(this.value)">
      </select>
    </div>

    <div class="form-group" id="customSupplierDiv" style="display:none;">
      <label>नया सप्लायर नाम दर्ज करें *</label>
      <input type="text" id="pPartyCustom" placeholder="नया सप्लायर फर्म नाम">
    </div>

    <div class="form-group">
      <label>भुगतान रकम (₹) *</label>
      <input type="number" id="pAmt" placeholder="0.00" style="font-weight:800; font-size:16px;">
    </div>
    <div class="form-group">
      <label>माध्यम</label>
      <select id="pMode">
        <option value="Bank">बैंक ट्रांसफर (RTGS/NEFT)</option>
        <option value="UPI">UPI / PhonePe</option>
        <option value="Cheque">चेक</option>
        <option value="Cash">नकद (Cash)</option>
      </select>
    </div>
    <button class="btn-act btn-pay" style="width:100%;" onclick="savePayment()">✓ भुगतान सेव करें</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tBills" onclick="toggleView('bills')">हालिया बिल</button>
    <button class="tab" id="tLedger" onclick="toggleView('ledger')">सप्लायर खाता (देनदारी)</button>
  </div>

  <div class="card-list" id="vBills"></div>
  <div class="card-list" id="vLedger" style="display:none;"></div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let bills = JSON.parse(localStorage.getItem('vm_bills') || '[]');
    let payments = JSON.parse(localStorage.getItem('vm_payments') || '[]');
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    function setApiKey() {
      const k = prompt("Google Gemini API Key दर्ज करें:", apiKey);
      if (k) {
        apiKey = k.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        alert("API Key सेव हो गई!");
      }
    }

    async function handleFileSelected(e, type) {
      const file = e.target.files[0];
      if (!file) return;

      if (!apiKey) {
        alert("कृपया पहले ऊपर '🔑 AI Key' बटन दबाकर अपनी Gemini API Key सेट करें।");
        setApiKey();
        if (!apiKey) return;
      }

      // Purana form chupayein
      document.getElementById('billForm').style.display = 'none';
      const loader = document.getElementById('aiLoader');
      const statusText = document.getElementById('loaderStatus');
      loader.style.display = 'block';

      try {
        let base64Image = "";
        if (type === 'pdf') {
          statusText.innerText = "PDF को प्रोसेस किया जा रहा है...";
          base64Image = await convertPdfToImageBase64(file);
        } else {
          statusText.innerText = "फोटो कंप्रेस हो रही है...";
          base64Image = await compressImageToBase64(file);
        }

        statusText.innerText = "Gemini 3.8 AI बिल पढ़ रहा है...";
        await callGeminiAI(base64Image);
      } catch (err) {
        loader.style.display = 'none';
        alert("स्कैन एरर: " + err.message);
      } finally {
        e.target.value = '';
      }
    }

    async function convertPdfToImageBase64(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 2.0 });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = 900 / Math.max(img.width, img.height);
            canvas.width = img.width * (scale < 1 ? scale : 1);
            canvas.height = img.height * (scale < 1 ? scale : 1);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.75).split(',')[1]);
          };
          img.onerror = () => reject(new Error("फोटो लोड नहीं हो सकी"));
        };
        reader.onerror = () => reject(new Error("फाइल पढ़ने में समस्या"));
      });
    }

    async function callGeminiAI(base64Data) {
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const promptText = `Extract invoice details from this image. Output ONLY RAW JSON (no markdown backticks, no words outside JSON).
Structure:
{
  "supplierName": "Seller or company at top",
  "buyerName": "Buyer or customer name",
  "invoiceNo": "Invoice/Bill number",
  "date": "YYYY-MM-DD",
  "items": [{"name": "Item description", "qty": 1, "rate": 0, "total": 0}],
  "grandTotal": 0
}`;

      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: "image/jpeg", data: base64Data } }
            ]
          }]
        })
      });

      document.getElementById('aiLoader').style.display = 'none';
      const resJson = await res.json();

      if (resJson.error) {
        throw new Error("Google API Error: " + resJson.error.message);
      }

      if (resJson.candidates && resJson.candidates[0].content) {
        let text = resJson.candidates[0].content.parts[0].text;
        text = text.replace(/```json/gi, '').replace(/```/gi, '').trim();

        let parsed = null;
        try {
          parsed = JSON.parse(text);
        } catch (pe) {
          // JSON string cleaning
          const start = text.indexOf('{');
          const end = text.lastIndexOf('}');
          if (start !== -1 && end !== -1) {
            try {
              parsed = JSON.parse(text.substring(start, end + 1));
            } catch(e) {}
          }
        }

        if (parsed) {
          openBillFormWithData(parsed);
        } else {
          // Fallback parsing
          openBillFormWithData({
            supplierName: extractRegex(text, /supplier(?:Name)?["':\s*]+([^\n",*]+)/i),
            buyerName: extractRegex(text, /buyer(?:Name)?["':\s*]+([^\n",*]+)/i),
            invoiceNo: extractRegex(text, /invoice(?:No)?["':\s*]+([^\n",*]+)/i),
            grandTotal: extractAmount(text)
          });
        }
      } else {
        throw new Error("AI ne image se koi text return nahi kiya.");
      }
    }

    function extractRegex(text, regex) {
      const match = text.match(regex);
      return match ? match[1].trim() : '';
    }

    function extractAmount(text) {
      const match = text.match(/grandTotal["':\s*]+([\d,.]+)/i) || text.match(/Total(?: Amount)?[:\s*]+[₹Rs.\s]*([\d,.]+)/i);
      return match ? parseFloat(match[1].replace(/,/g, '')) : 0;
    }

    function openBillFormWithData(d) {
      document.getElementById('bSupplier').value = d.supplierName || '';
      document.getElementById('bBuyer').value = d.buyerName || '';
      document.getElementById('bNo').value = d.invoiceNo || 'B-' + Math.floor(100 + Math.random()*900);
      document.getElementById('bDate').value = d.date || new Date().toISOString().split('T')[0];
      document.getElementById('bTotal').value = d.grandTotal || 0;
      document.getElementById('bAdvance').value = 0;

      const tb = document.getElementById('tblItems');
      tb.innerHTML = '';
      if (d.items && d.items.length > 0) {
        d.items.forEach(it => {
          tb.innerHTML += `<tr>
            <td><input type="text" value="${it.name || ''}"></td>
            <td><input type="number" value="${it.qty || 1}"></td>
            <td><input type="number" value="${it.rate || 0}"></td>
            <td><input type="number" value="${it.total || 0}"></td>
          </tr>`;
        });
      } else {
        tb.innerHTML = `<tr>
          <td><input type="text" value="वस्त्र सामग्री"></td>
          <td><input type="number" value="1"></td>
          <td><input type="number" value="${d.grandTotal || 0}"></td>
          <td><input type="number" value="${d.grandTotal || 0}"></td>
        </tr>`;
      }

      document.getElementById('billForm').style.display = 'block';
      window.scrollTo({ top: 320, behavior: 'smooth' });
    }

    function saveBill() {
      const supplier = document.getElementById('bSupplier').value.trim() || document.getElementById('bBuyer').value.trim();
      const total = parseFloat(document.getElementById('bTotal').value) || 0;
      const adv = parseFloat(document.getElementById('bAdvance').value) || 0;

      if (!supplier) return alert("कृपया सप्लायर का नाम लिखें");
      if (total <= 0) return alert("बिल की कुल रकम लिखें");

      bills = JSON.parse(localStorage.getItem('vm_bills') || '[]');
      payments = JSON.parse(localStorage.getItem('vm_payments') || '[]');

      bills.unshift({
        id: 'B_' + Date.now(),
        supplier: supplier,
        buyer: document.getElementById('bBuyer').value.trim(),
        no: document.getElementById('bNo').value,
        date: document.getElementById('bDate').value,
        total: total
      });

      if (adv > 0) {
        payments.unshift({
          id: 'P_' + Date.now(),
          party: supplier,
          amt: adv,
          date: document.getElementById('bDate').value,
          mode: 'Advance'
        });
      }

      localStorage.setItem('vm_bills', JSON.stringify(bills));
      localStorage.setItem('vm_payments', JSON.stringify(payments));

      document.getElementById('billForm').style.display = 'none';
      render();
      alert("✓ नया बिल सुरक्षित हो गया!");
    }

    function showPayForm() {
      bills = JSON.parse(localStorage.getItem('vm_bills') || '[]');
      const uniqueSuppliers = [...new Set(bills.map(b => b.supplier).filter(Boolean))];
      
      const select = document.getElementById('pPartySelect');
      select.innerHTML = '<option value="">-- सप्लायर चुनें --</option>';
      uniqueSuppliers.forEach(name => {
        select.innerHTML += `<option value="${name}">${name}</option>`;
      });
      select.innerHTML += '<option value="__NEW__">➕ नया सप्लायर लिखें...</option>';

      document.getElementById('customSupplierDiv').style.display = 'none';
      document.getElementById('pPartyCustom').value = '';
      document.getElementById('pAmt').value = '';
      document.getElementById('payForm').style.display = 'block';
      window.scrollTo({ top: 320, behavior: 'smooth' });
    }

    function checkCustomSupplier(val) {
      const customDiv = document.getElementById('customSupplierDiv');
      if (val === '__NEW__') {
        customDiv.style.display = 'block';
      } else {
        customDiv.style.display = 'none';
      }
    }

    function savePayment() {
      const selectVal = document.getElementById('pPartySelect').value;
      let finalParty = selectVal;

      if (selectVal === '__NEW__') {
        finalParty = document.getElementById('pPartyCustom').value.trim();
      }

      const amt = parseFloat(document.getElementById('pAmt').value) || 0;
      if (!finalParty) return alert("कृपया सप्लायर चुनें या नाम लिखें");
      if (amt <= 0) return alert("वैध रकम दर्ज करें");

      payments = JSON.parse(localStorage.getItem('vm_payments') || '[]');
      payments.unshift({
        id: 'P_' + Date.now(),
        party: finalParty,
        amt: amt,
        date: new Date().toISOString().split('T')[0],
        mode: document.getElementById('pMode').value
      });

      localStorage.setItem('vm_payments', JSON.stringify(payments));
      document.getElementById('payForm').style.display = 'none';
      render();
      alert("✓ भुगतान दर्ज हो गया!");
    }

    function toggleView(v) {
      if (v === 'bills') {
        document.getElementById('vBills').style.display = 'block';
        document.getElementById('vLedger').style.display = 'none';
        document.getElementById('tBills').classList.add('active');
        document.getElementById('tLedger').classList.remove('active');
      } else {
        document.getElementById('vBills').style.display = 'none';
        document.getElementById('vLedger').style.display = 'block';
        document.getElementById('tBills').classList.remove('active');
        document.getElementById('tLedger').classList.add('active');
      }
    }

    function render() {
      bills = JSON.parse(localStorage.getItem('vm_bills') || '[]');
      payments = JSON.parse(localStorage.getItem('vm_payments') || '[]');

      let bSum = bills.reduce((s, b) => s + b.total, 0);
      let pSum = payments.reduce((s, p) => s + p.amt, 0);

      document.getElementById('dashBilled').innerText = '₹' + bSum.toLocaleString('en-IN');
      document.getElementById('dashPaid').innerText = '₹' + pSum.toLocaleString('en-IN');
      document.getElementById('dashDue').innerText = '₹' + Math.max(0, bSum - pSum).toLocaleString('en-IN');
      document.getElementById('dashCount').innerText = bills.length;

      document.getElementById('vBills').innerHTML = bills.map(b => `
        <div class="row-card">
          <div>
            <h4>🏢 ${b.supplier}</h4>
            <p>बिल नं: ${b.no} | खरीदार: ${b.buyer || 'Self'} | तारीख: ${b.date}</p>
          </div>
          <div class="amt">₹${b.total.toLocaleString('en-IN')}</div>
        </div>
      `).join('') || '<p style="text-align:center; color:gray; padding:20px;">कोई बिल नहीं है</p>';

      const parties = {};
      bills.forEach(b => {
        parties[b.supplier] = parties[b.supplier] || { b: 0, p: 0 };
        parties[b.supplier].b += b.total;
      });
      payments.forEach(p => {
        parties[p.party] = parties[p.party] || { b: 0, p: 0 };
        parties[p.party].p += p.amt;
      });

      document.getElementById('vLedger').innerHTML = Object.keys(parties).map(k => {
        const due = parties[k].b - parties[k].p;
        return `
          <div class="row-card">
            <div>
              <h4>🏢 ${k}</h4>
              <p>कुल खरीद: ₹${parties[k].b.toLocaleString('en-IN')} | चुकाया: ₹${parties[k].p.toLocaleString('en-IN')}</p>
            </div>
            <div class="amt" style="color:${due > 0 ? 'var(--danger)' : 'var(--success)'};">
              ${due > 0 ? 'देना बाकी: ₹' + due.toLocaleString('en-IN') : 'चुका दिया ✓'}
            </div>
          </div>
        `;
      }).join('') || '<p style="text-align:center; color:gray; padding:20px;">खाते में कोई सप्लायर नहीं है</p>';
    }

    render();
  </script>
</body>
</html>
